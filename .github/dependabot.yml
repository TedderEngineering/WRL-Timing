# Weekly dependency updates. Security updates come as soon as an advisory is published (turn on
# "Dependabot security updates" in the repository's Code security settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]
    # supabase-js 2.98+ needs Node 22 (native WebSocket); the server runs Node 20 on Railway. Unpin
    # once the server moves to Node 22.
    ignore:
      - dependency-name: "@supabase/*"
        versions: [">=2.98.0"]
      # Major versions are planned upgrades (Prisma 7 needs a migration; TypeScript 7 isn't supported
      # by typescript-eslint yet), not weekly PRs: a red check on a server package can take the API down.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    groups:
      client-minor-and-patch:
        update-types: [minor, patch]
    # Major versions are planned upgrades, not weekly PRs.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 2
    groups:
      actions:
        update-types: [minor, patch, major]
    labels: [dependencies]
