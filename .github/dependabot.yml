# Weekly dependency updates. Security updates come as soon as an advisory is published (turn on
# "Dependabot security updates" in the repository's Code security settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    groups:
      server-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    groups:
      client-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 2
    groups:
      actions:
        update-types: [minor, patch, major]
    labels: [dependencies]
