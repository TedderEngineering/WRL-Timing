# RaceTrace intake on GitHub's runners (RaceTrace 2.0, G4): discover race sessions on
# the timing sites and, when asked, import the raw races into RaceTrace as DRAFTS.
#
# Run it from the Actions tab (works from a phone): Actions → "RaceTrace intake" → Run workflow.
#   mode = discover   lists what is new or changed; nothing is written anywhere.
#   mode = reimport-plan  pairs every race already on the site (no source key) with its timing
#                     session by its cars, laps and race number: exact / unsure / duplicate /
#                     not found. Nothing is written.
#   mode = reimport   the same, then re-imports every exact pair in place (same id, URL, name
#                     and status; the old files stay archived). Unsure, duplicate and not-found
#                     races are left as they are.
#   mode = analyze    facts + rule checks for every race with a source key that has no analysis
#                     package yet (newest first), uploaded as a DRAFT package. No stories: a
#                     package cannot be published until its stories and summary are written.
#   mode = names-plan lists, for every race with a source key, its standard name ("GR Cup Race 1 —
#                     Circuit of the Americas") and the day it ran from its timing session.
#                     Nothing is written.
#   mode = names      the same, then renames and re-dates those races (same id, link and status).
#   mode = refresh    pulls every race that already has a source key again and re-imports it in
#                     place (same id, link, name and status), so a parser change reaches older races.
#   mode = import     also pulls those sessions and pushes them to RaceTrace as drafts, under the
#                     standard name, then builds their facts + rule checks as DRAFT packages.
#                     New sessions that may be a race already on the site (an older
#                     upload without a source key) are skipped and listed, unless the
#                     owner ticks replace_matched: then a session with exactly one
#                     matching race replaces that race's data (same id, URL, name and
#                     status); sessions with several possible matches are still held.
#
# On race weekends it runs hourly (Fri-Sun afternoons and evenings, US time), importing sessions of
# the last 3 days; and the server starts it for one WRL race about 20 min after that race ends.
# Every Monday it also runs on its own (schedule below): mode = import for IMSA, SRO and WRL,
# the current season, sessions from the last 21 days. New races arrive as drafts, provisional
# results that turned official are updated in place, and possible duplicates of races already
# on the site are held and listed for the owner (replace_matched off). Nothing is published.
#
# Needs repository secrets RACETRACE_API_URL and RACETRACE_API_TOKEN (Admin → API Tokens,
# scope "intake"); WRL 2025 from Speedhive also needs SPEEDHIVE_WRL_ORG_ID.
#
# Raw timing files are third-party data: they stay on the runner (deleted when the job
# ends) and in RaceTrace's private storage. They are never uploaded as workflow artifacts
# or committed. Only the session list (dates, names, source keys) goes to the job summary.
# Nothing is published: races arrive as drafts, as with the laptop intake.
name: RaceTrace intake

on:
  # Weekly import: Mondays 14:17 UTC (10:17 am Eastern in summer, 9:17 am in winter), after the
  # weekend's races. Off the hour, when GitHub's scheduler is less busy.
  schedule:
    - cron: "17 14 * * 1"
    # Race weekends (US afternoons and evenings, Friday to Sunday): hourly, so a race is in a
    # couple of hours after the flag. WRL races also start an import from the server when they end
    # (live/after-race.ts); this is the safety net, and the way in for IMSA and SRO.
    - cron: "23 15-23 * * 5,6,0"
    - cron: "23 0-4 * * 6,0,1"
  workflow_dispatch:
    inputs:
      series:
        description: "Series ids, comma-separated (wrl, wrl-speedhive, imsa-mpc, imsa-*, sro-gt4, sro-grcup, sro-*)"
        required: true
        default: "wrl"
      season:
        description: "Season (year); reimport and analyze take several, e.g. 2025,2026"
        required: true
        default: "2026"
      since:
        description: "Only sessions on or after this date (YYYY-MM-DD); empty = whole season"
        required: false
        default: ""
      mode:
        description: "discover = list; import = new/changed races as drafts; reimport-plan = pair races on the site with their sessions; reimport = re-import the exact pairs in place; analyze = facts + rule checks as draft packages; names-plan = list race names/dates to standardise; names = apply them; refresh = re-import every keyed race in place (after a parser change)"
        type: choice
        options: [discover, import, reimport-plan, reimport, analyze, names-plan, names, refresh]
        default: discover
      limit:
        description: "analyze / refresh: at most this many races per run (newest first); empty = all"
        required: false
        default: ""
      races:
        description: "analyze only: these race ids (comma-separated) instead of every race without a package"
        required: false
        default: ""
      approve:
        description: "reimport only: race ids of 'unsure' pairs the owner approves, comma-separated"
        required: false
        default: ""
      redmist:
        description: "import/discover: only this RedMist session (event/session, e.g. 485/20); set by the server after a WRL race"
        required: false
        default: ""
      replace_matched:
        description: "import only: replace races already on the site when exactly one matches (same series, date and session); otherwise they are held"
        type: boolean
        default: false

concurrency:
  group: racetrace-intake
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: server
    env:
      RACETRACE_API_URL: ${{ secrets.RACETRACE_API_URL }}
      RACETRACE_API_TOKEN: ${{ secrets.RACETRACE_API_TOKEN }}
      SPEEDHIVE_WRL_ORG_ID: ${{ secrets.SPEEDHIVE_WRL_ORG_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json
      - run: npm ci

      - name: Check settings
        env:
          EVENT: ${{ github.event_name }}
          IN_MODE: ${{ inputs.mode }}
          IN_SERIES: ${{ inputs.series }}
          IN_SEASON: ${{ inputs.season }}
          IN_SINCE: ${{ inputs.since }}
          IN_REPLACE: ${{ inputs.replace_matched }}
          IN_REDMIST: ${{ inputs.redmist }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Work folder on the runner's temp disk (the runner context is not available in job-level env).
          echo "INTAKE_WORK_DIR=$RUNNER_TEMP/intake-work" >> "$GITHUB_ENV"
          # A scheduled run has no inputs: the weekly import's settings stand in for them.
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" != "17 14 * * 1" ]; then
            # Race-weekend hourly run: the last 3 days only.
            {
              echo "INTAKE_MODE=import"
              echo "INTAKE_SERIES=imsa-*,sro-*,wrl"
              echo "INTAKE_SEASON=$(date -u +%Y)"
              echo "INTAKE_SINCE=$(date -u -d '3 days ago' +%F)"
              echo "INTAKE_REPLACE=false"
              echo "INTAKE_REDMIST="
            } >> "$GITHUB_ENV"
            echo "Race-weekend import: IMSA, SRO and WRL, sessions since $(date -u -d '3 days ago' +%F)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$EVENT" = "schedule" ]; then
            {
              echo "INTAKE_MODE=import"
              echo "INTAKE_SERIES=imsa-*,sro-*,wrl"
              echo "INTAKE_SEASON=$(date -u +%Y)"
              echo "INTAKE_SINCE=$(date -u -d '21 days ago' +%F)"
              echo "INTAKE_REPLACE=false"
            } >> "$GITHUB_ENV"
            echo "Weekly import: IMSA, SRO and WRL $(date -u +%Y), sessions since $(date -u -d '21 days ago' +%F)." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "INTAKE_MODE=$IN_MODE"
              echo "INTAKE_SERIES=$IN_SERIES"
              echo "INTAKE_SEASON=$IN_SEASON"
              echo "INTAKE_SINCE=$IN_SINCE"
              echo "INTAKE_REPLACE=$IN_REPLACE"
              echo "INTAKE_REDMIST=$IN_REDMIST"
            } >> "$GITHUB_ENV"
          fi
          if [ -z "$RACETRACE_API_URL" ] || [ -z "$RACETRACE_API_TOKEN" ]; then
            echo "::error::Add the repository secrets RACETRACE_API_URL and RACETRACE_API_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          npx tsx scripts/intake.ts preflight

      - name: Re-import plan
        if: env.INTAKE_MODE == 'reimport-plan' || env.INTAKE_MODE == 'reimport'
        env:
          SERIES: ${{ env.INTAKE_SERIES }}
          SEASON: ${{ env.INTAKE_SEASON }}
          APPLY: ${{ env.INTAKE_MODE == 'reimport' }}
          APPROVE: ${{ inputs.approve }}
        run: |
          set -o pipefail
          args=(--series "$SERIES" --season "$SEASON" --save "$INTAKE_WORK_DIR/reimport-plan.json" --notes "$RUNNER_TEMP/plan-notes.txt")
          [ -n "$APPROVE" ] && args+=(--approve "$APPROVE")
          [ "$APPLY" = "true" ] && args+=(--apply)
          status=0
          npx tsx scripts/intake.ts reimport-plan "${args[@]}" > "$RUNNER_TEMP/plan.txt" 2> "$RUNNER_TEMP/plan.log" || status=1
          tail -n 40 "$RUNNER_TEMP/plan.log"
          cat "$RUNNER_TEMP/plan.txt"
          { echo "## Re-import plan: $SERIES $SEASON"; echo '```'; cat "$RUNNER_TEMP/plan.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # Annotations hold about 4 KB and a step may post ten of each kind: post the compact plan
          # in parts so all of it can be read through the checks API.
          if [ -f "$RUNNER_TEMP/plan-notes.txt" ]; then
            node -e '
              const t = require("fs").readFileSync(process.argv[1], "utf8").split("\n");
              const parts = []; let cur = "";
              for (const l of t) { if (cur.length + l.length + 1 > 3800) { parts.push(cur); cur = ""; } cur += l + "\n"; }
              if (cur.trim()) parts.push(cur);
              const enc = (x) => x.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
              parts.slice(0, 10).forEach((p, i) => console.log(`::notice title=Re-import plan ${i + 1}/${Math.min(parts.length, 10)}${parts.length > 10 ? " (more in the job summary)" : ""}::` + enc(p)));
            ' "$RUNNER_TEMP/plan-notes.txt"
          fi
          if [ "$status" -ne 0 ]; then
            node -e 'const t=require("fs").readFileSync(process.argv[1],"utf8").split("\n").slice(-25).join("\n");console.log("::error title=Re-import plan failed::"+t.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"))' "$RUNNER_TEMP/plan.log"
          fi
          exit $status

      - name: Facts for the imported races (draft packages)
        # Right after an import (by hand or the Monday run): facts and rule checks for every race the
        # push created or updated, uploaded as a DRAFT package, so the stories can be written on them.
        if: env.INTAKE_MODE == 'import' && !cancelled()
        run: |
          [ -f "$RUNNER_TEMP/push.txt" ] || { echo "Nothing imported."; exit 0; }
          ids=$(grep -E '^(created|updated|attached)[[:space:]]+[a-z0-9]+' "$RUNNER_TEMP/push.txt" | awk '{print $2}' | sort -u)
          [ -n "$ids" ] || { echo "No race created or updated."; exit 0; }
          args=(--notes "$RUNNER_TEMP/import-facts-notes.txt")
          for id in $ids; do args+=(--race "$id"); done
          status=0
          npx tsx scripts/intake.ts analyze "${args[@]}" > "$RUNNER_TEMP/import-facts.txt" 2> "$RUNNER_TEMP/import-facts.log" || status=1
          tail -n 40 "$RUNNER_TEMP/import-facts.log"
          cat "$RUNNER_TEMP/import-facts.txt"
          { echo "## Facts for the imported races"; echo '```'; cat "$RUNNER_TEMP/import-facts.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          f="$RUNNER_TEMP/import-facts-notes.txt"; title="Facts"
          if [ ! -s "$f" ]; then f="$RUNNER_TEMP/import-facts.log"; title="Facts failed"; fi
          node -e '
            const [file, title] = process.argv.slice(1);
            const t = require("fs").readFileSync(file, "utf8").split("\n").slice(-200);
            const parts = []; let cur = "";
            for (const l of t) { if (cur.length + l.length + 1 > 3800) { parts.push(cur); cur = ""; } cur += l + "\n"; }
            if (cur.trim()) parts.push(cur);
            const enc = (x) => x.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            parts.slice(0, 5).forEach((p, i) => console.log(`::notice title=${title} ${i + 1}/${Math.min(parts.length, 5)}::` + enc(p)));
          ' "$f" "$title"
          exit $status

      - name: Analyze (facts + rule checks, draft packages)
        if: env.INTAKE_MODE == 'analyze'
        env:
          SERIES: ${{ env.INTAKE_SERIES }}
          SEASON: ${{ env.INTAKE_SEASON }}
          LIMIT: ${{ inputs.limit }}
          RACES: ${{ inputs.races }}
        run: |
          args=(--series "$SERIES" --season "$SEASON" --notes "$RUNNER_TEMP/analyze-notes.txt")
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          for id in ${RACES//,/ }; do args+=(--race "$id"); done
          status=0
          npx tsx scripts/intake.ts analyze "${args[@]}" > "$RUNNER_TEMP/analyze.txt" 2> "$RUNNER_TEMP/analyze.log" || status=1
          tail -n 60 "$RUNNER_TEMP/analyze.log"
          cat "$RUNNER_TEMP/analyze.txt"
          { echo "## Analyze: $SERIES $SEASON"; echo '```'; cat "$RUNNER_TEMP/analyze.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          f="$RUNNER_TEMP/analyze-notes.txt"; title="Analyze"
          if [ ! -s "$f" ]; then f="$RUNNER_TEMP/analyze.log"; title="Analyze failed"; fi
          node -e '
            const [file, title] = process.argv.slice(1);
            const t = require("fs").readFileSync(file, "utf8").split("\n").slice(-400);
            const parts = []; let cur = "";
            for (const l of t) { if (cur.length + l.length + 1 > 3800) { parts.push(cur); cur = ""; } cur += l + "\n"; }
            if (cur.trim()) parts.push(cur);
            const enc = (x) => x.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            parts.slice(0, 10).forEach((p, i) => console.log(`::notice title=${title} ${i + 1}/${Math.min(parts.length, 10)}::` + enc(p)));
          ' "$f" "$title"
          exit $status

      - name: Names and dates
        if: env.INTAKE_MODE == 'names-plan' || env.INTAKE_MODE == 'names'
        env:
          SERIES: ${{ env.INTAKE_SERIES }}
          SEASON: ${{ env.INTAKE_SEASON }}
          APPLY: ${{ env.INTAKE_MODE == 'names' }}
        run: |
          args=(--series "$SERIES" --season "$SEASON" --notes "$RUNNER_TEMP/names-notes.txt")
          [ "$APPLY" = "true" ] && args+=(--apply)
          status=0
          npx tsx scripts/intake.ts names "${args[@]}" > "$RUNNER_TEMP/names.txt" 2> "$RUNNER_TEMP/names.log" || status=1
          tail -n 30 "$RUNNER_TEMP/names.log"
          cat "$RUNNER_TEMP/names.txt"
          { echo "## Names and dates: $SERIES $SEASON"; echo '```'; cat "$RUNNER_TEMP/names.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          f="$RUNNER_TEMP/names-notes.txt"; title="Names"
          if [ ! -s "$f" ]; then f="$RUNNER_TEMP/names.log"; title="Names failed"; fi
          node -e '
            const [file, title] = process.argv.slice(1);
            const t = require("fs").readFileSync(file, "utf8").split("\n");
            const parts = []; let cur = "";
            for (const l of t) { if (cur.length + l.length + 1 > 3800) { parts.push(cur); cur = ""; } cur += l + "\n"; }
            if (cur.trim()) parts.push(cur);
            const enc = (x) => x.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            parts.slice(0, 10).forEach((p, i) => console.log(`::notice title=${title} ${i + 1}/${Math.min(parts.length, 10)}${parts.length > 10 ? " (more in the job summary)" : ""}::` + enc(p)));
          ' "$f" "$title"
          exit $status

      - name: Refresh (re-import keyed races in place)
        if: env.INTAKE_MODE == 'refresh'
        env:
          SERIES: ${{ env.INTAKE_SERIES }}
          SEASON: ${{ env.INTAKE_SEASON }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=(--series "$SERIES" --season "$SEASON")
          [ -n "$LIMIT" ] && args+=(--limit "$LIMIT")
          status=0
          npx tsx scripts/intake.ts refresh "${args[@]}" > "$RUNNER_TEMP/refresh.txt" 2> "$RUNNER_TEMP/refresh.log" || status=1
          tail -n 40 "$RUNNER_TEMP/refresh.log"
          cat "$RUNNER_TEMP/refresh.txt"
          node -e '
            const fs = require("fs");
            const t = fs.readFileSync(process.argv[1], "utf8").split("\n");
            const log = fs.readFileSync(process.argv[2], "utf8").split("\n").filter((l) => /HTTP \d{3}|ERROR/.test(l));
            const counts = {};
            for (const l of t.slice(1)) { const k = l.trim().split(/\s{2,}/)[0]; if (k) counts[k] = (counts[k] || 0) + 1; }
            const body = [`REFRESH: ${Object.entries(counts).map(([k, v]) => `${v} ${k}`).join(", ")}`, "", "ERRORS", ...log, "", ...t];
            const parts = []; let cur = "";
            for (const l of body) { if (cur.length + l.length + 1 > 3800) { parts.push(cur); cur = ""; } cur += l + "\n"; }
            if (cur.trim()) parts.push(cur);
            const enc = (x) => x.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            parts.slice(0, 8).forEach((p, i) => console.log(`::notice title=Refresh ${i + 1}/${Math.min(parts.length, 8)}::` + enc(p)));
          ' "$RUNNER_TEMP/refresh.txt" "$RUNNER_TEMP/refresh.log"
          exit $status

      - name: Discover
        if: env.INTAKE_MODE == 'discover' || env.INTAKE_MODE == 'import'
        env:
          SERIES: ${{ env.INTAKE_SERIES }}
          SEASON: ${{ env.INTAKE_SEASON }}
          SINCE: ${{ env.INTAKE_SINCE }}
          REDMIST: ${{ env.INTAKE_REDMIST }}
        run: |
          args=(--series "$SERIES" --season "$SEASON" --save "$INTAKE_WORK_DIR/discover.json")
          if [ -n "$SINCE" ]; then args+=(--since "$SINCE"); fi
          if [ -n "$REDMIST" ]; then args+=(--redmist "$REDMIST"); fi
          npx tsx scripts/intake.ts discover "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/discover.txt"
          # Also as an annotation: readable through the checks API and on the run page without signing in.
          node -e 'const t=require("fs").readFileSync(process.argv[1],"utf8").slice(-60000);console.log("::notice title=Discover::"+t.replace(/%/g,"%25").replace(/\r/g,"%0D").replace(/\n/g,"%0A"))' "$RUNNER_TEMP/discover.txt"
          {
            echo "## Discover: $SERIES $SEASON${SINCE:+ since $SINCE}"
            echo '```'
            cat "$RUNNER_TEMP/discover.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pull and push as drafts
        if: env.INTAKE_MODE == 'import'
        env:
          REPLACE: ${{ env.INTAKE_REPLACE }}
        run: |
          set -o pipefail
          # replace_matched: a new session with exactly one matching race on the site replaces it; otherwise it is held.
          lim=0; [ "$REPLACE" = "true" ] && lim=1
          n=$(node -e 'const d=require(process.argv[1]),L=+process.argv[2];console.log(d.sessions.filter(s=>["new","changed","results-upgrade"].includes(s.state)&&!(s.state==="new"&&(s.attachCandidates||[]).length>L)).length)' "$INTAKE_WORK_DIR/discover.json" "$lim")
          held=$(node -e 'const d=require(process.argv[1]),L=+process.argv[2];for(const s of d.sessions.filter(s=>s.state==="new"&&(s.attachCandidates||[]).length>L))console.log(`- ${s.date} ${s.event} — ${s.session}: may be ${s.attachCandidates.map(r=>`${r.name} (${r.raceId})`).join("; ")}`)' "$INTAKE_WORK_DIR/discover.json" "$lim")
          if [ -n "$held" ]; then
            { echo "## Waiting for the owner (possible duplicates of races already on the site)"; echo "$held"; } >> "$GITHUB_STEP_SUMMARY"
            # Through the environment: a list starting with "- " passed as an argument is read by node as an option (exit 9).
            HELD="$held" node -e 'console.log("::notice title=Waiting for the owner (possible duplicates)::"+process.env.HELD.replace(/%/g,"%25").replace(/\n/g,"%0A"))'
          fi
          if [ "$n" = "0" ]; then
            echo "Nothing to import." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          attach_flag=--skip-attach-candidates; [ "$REPLACE" = "true" ] && attach_flag=--attach-single-candidates
          npx tsx scripts/intake.ts pull --from "$INTAKE_WORK_DIR/discover.json" "$attach_flag" > "$RUNNER_TEMP/pull.txt" 2>&1 || status=1
          tail -n 200 "$RUNNER_TEMP/pull.txt"
          # The pull log as notices (errors first), readable through the checks API without signing in.
          node -e '
            const t = require("fs").readFileSync(process.argv[1], "utf8").split("\n");
            const bad = t.filter((l) => /ERROR|FAILED|skipped|Usage|Error:/.test(l));
            const body = [`${bad.length} problem line(s)`, ...bad.slice(0, 120), "", "--- end of log ---", ...t.slice(-60)];
            const parts = []; let cur = "";
            for (const l of body) { if (cur.length + l.length + 1 > 3800) { parts.push(cur); cur = ""; } cur += l + "\n"; }
            if (cur.trim()) parts.push(cur);
            const enc = (x) => x.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
            parts.slice(0, 6).forEach((p, i) => console.log(`::notice title=Pull ${i + 1}/${Math.min(parts.length, 6)}::` + enc(p)));
          ' "$RUNNER_TEMP/pull.txt"
          dirs=()
          for m in "$INTAKE_WORK_DIR"/*/manifest.json; do [ -f "$m" ] && dirs+=("$(dirname "$m")"); done
          if [ ${#dirs[@]} -gt 0 ]; then
            npx tsx scripts/intake.ts push "${dirs[@]}" 2>&1 | tee "$RUNNER_TEMP/push.txt" || status=1
            # Results table first (the end of the log), then errors, in notice-sized parts.
            node -e '
              const t = require("fs").readFileSync(process.argv[1], "utf8").split("\n");
              const at = t.findIndex((l) => /^ACTION\s+RACE/.test(l));
              const table = at >= 0 ? t.slice(at) : [];
              const counts = {};
              for (const l of table.slice(1)) { const k = l.trim().split(/\s{2,}/)[0]; if (k) counts[k] = (counts[k] || 0) + 1; }
              const errs = t.filter((l) => /HTTP \d{3}|ERROR|error \d{3}/.test(l));
              const body = [`PUSH: ${Object.entries(counts).map(([k, v]) => `${v} ${k}`).join(", ") || "no table"}`, "", "ERRORS", ...errs, "", ...table];
              const parts = []; let cur = "";
              for (const l of body) { if (cur.length + l.length + 1 > 3800) { parts.push(cur); cur = ""; } cur += l + "\n"; }
              if (cur.trim()) parts.push(cur);
              const enc = (x) => x.replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
              parts.slice(0, 8).forEach((p, i) => console.log(`::notice title=Imported ${i + 1}/${Math.min(parts.length, 8)}::` + enc(p)));
            ' "$RUNNER_TEMP/push.txt"
            { echo "## Imported as drafts"; echo '```'; cat "$RUNNER_TEMP/push.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
