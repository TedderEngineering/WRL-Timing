<!DOCTYPE html>
<!-- Served for findinggrip.tedderengineering.com (see vercel.json). Same app as index.html. -->
<html lang="en" class="dark grip-site">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/finding-grip-logo.png" />
    <link rel="apple-touch-icon" href="/finding-grip-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free tire pressure calculator and damper tuning tool for race and track day cars, by Tedder Engineering." />
    <meta name="theme-color" content="#030712" />
    <meta property="og:site_name" content="Finding Grip" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Finding Grip by Tedder Engineering" />
    <meta property="og:description" content="Set cold tire pressures that come in on target. Free tire pressure calculator and damper tuning tool for race and track day cars." />
    <meta property="og:url" content="https://findinggrip.tedderengineering.com/" />
    <meta property="og:image" content="https://findinggrip.tedderengineering.com/finding-grip-logo.png" />
    <meta name="twitter:card" content="summary" />
    <title>Finding Grip by Tedder Engineering</title>
    <script>
      // Apply theme before first paint to prevent flash
      (function() {
        // The same app is served as Finding Grip on its own address.
        if (location.hostname.toLowerCase().indexOf('findinggrip.') === 0) {
          document.documentElement.classList.add('grip-site');
          document.title = 'Finding Grip by Tedder Engineering';
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) { icon.type = 'image/png'; icon.href = '/finding-grip-logo.png'; }
        }
        var theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
