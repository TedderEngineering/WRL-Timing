<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/racetrace-icon-192.png" />
    <link rel="apple-touch-icon" href="/racetrace-apple-touch-icon.png" />
    <link rel="manifest" href="/racetrace.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RaceTrace" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#0b0b18" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Interactive race analysis and position trace charts by Tedder Engineering" />
    <title>RaceTrace by Tedder Engineering</title>
    <!-- Link previews (chat apps fetch these without running JavaScript, so the image URL is absolute). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RaceTrace" />
    <meta property="og:title" content="RaceTrace by Tedder Engineering" />
    <meta property="og:description" content="Free lap charts, position traces, pit cycles and race stories for WRL, IMSA and SRO races." />
    <meta property="og:url" content="https://racetrace.tedderengineering.com/" />
    <meta property="og:image" content="https://racetrace.tedderengineering.com/racetrace-og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RaceTrace: a position trace of a race, with the pit cycles marked and one car's line highlighted." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://racetrace.tedderengineering.com/racetrace-og.png" />
    <script>
      // Apply theme before first paint to prevent flash
      (function() {
        // The same app is served as Finding Grip on its own address.
        if (location.hostname.toLowerCase().indexOf('findinggrip.') === 0) {
          document.documentElement.classList.add('grip-site');
          document.title = 'Finding Grip by Tedder Engineering';
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) { icon.type = 'image/png'; icon.href = '/finding-grip-logo.png'; }
        }
        var theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <script>
      // A live race page: ask for the race now, while the app is still loading (useLiveChartData
      // takes these over). A live race needs the hour's key, kept from an earlier visit
      // (features/live/liveKey.ts); a replay needs none. Anything missing: the app asks itself.
      (function() {
        try {
          var m = /^\/live\/([^\/?#]+)\/?$/.exec(location.pathname);
          if (!m || !window.fetch) return;
          var slug = m[1];
          var k = null;
          if (slug.indexOf('replay-') !== 0) {
            var s = JSON.parse(localStorage.getItem('rt.live.key') || 'null');
            if (!s || typeof s.k !== 'string' || !(Date.now() < s.renewAt)) return;
            k = s.k;
          }
          var early = (window.__rtEarly = {});
          var get = function(path) {
            var url = '/api' + path + (k ? (path.indexOf('?') < 0 ? '?' : '&') + 'k=' + encodeURIComponent(k) : '');
            var p = fetch(url, { credentials: 'omit' })
              .then(function(r) {
                if (!r.ok) return { ok: false };
                var age = Number(r.headers.get('Age')) || 0;
                return r.json().then(function(body) { return { ok: true, body: body, age: age }; });
              })
              .catch(function() { return { ok: false }; });
            var e = (early[path] = { at: Date.now(), p: p });
            p.then(function() { e.doneAt = Date.now(); });
            return p;
          };
          get('/live/' + slug + '/head').then(function(h) {
            if (h.ok && h.body && h.body.epoch && h.body.v > 0) get('/live/' + slug + '/full/' + h.body.epoch + '/' + h.body.v);
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
