<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/racetrace-icon-192.png" />
    <link rel="apple-touch-icon" href="/racetrace-apple-touch-icon.png" />
    <link rel="manifest" href="/racetrace.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="RaceTrace" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="theme-color" content="#0b0b18" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive race analysis and position trace charts by Tedder Engineering" />
    <title>RaceTrace by Tedder Engineering</title>
    <script>
      // Apply theme before first paint to prevent flash
      (function() {
        // The same app is served as Finding Grip on its own address.
        if (location.hostname.toLowerCase().indexOf('findinggrip.') === 0) {
          document.documentElement.classList.add('grip-site');
          document.title = 'Finding Grip by Tedder Engineering';
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) { icon.type = 'image/png'; icon.href = '/finding-grip-logo.png'; }
        }
        var theme = localStorage.getItem('theme') || 'dark';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-gray-950 text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
