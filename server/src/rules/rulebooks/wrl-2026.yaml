# RaceTrace rulebook: World Racing League, 2026 season. DRAFT, nothing verified.
# The 2026 WRL rulebook could NOT be obtained: https://www.racewrl.com/rules disallows automated fetching and the
# event supplemental rules are Google Drive files that need a browser. The only full rulebook reachable is
# "2022 Rules Version: 2022.2.1"; the only supplemental rules reachable are Road Atlanta, February 2023.
# Every rule carried from those documents is `season_confirmed: false` (findings cap at "possible").
# NOTE: the COTA races in the reference set (Dec 2025) may fall under the 2025 rulebook; see open question Q-WRL-4.
schema: racetrace-rulebook/0.1
id: wrl-2026
series:
  id: wrl
  name: World Racing League
  timing_formats: [speedhive, wrl_website, wrl_redmist]
