open_questions:
  - id: Q-WRL-1
    question: "Supply the 2026 WRL rulebook PDF (and 2025 if the COTA December 2025 races fall under it)."
    blocks: [wrl.drive.max_stint, wrl.drive.min_break_between_stints, wrl.fcy.code35, wrl.classification.official_finish]
    who: owner
    where_to_get_it: "https://www.racewrl.com/rules (download in a browser)."
  - id: Q-WRL-2
    question: "Supply the supplemental rules for Barber (Feb 2026) and COTA (Dec 2025): minimum pit time, max drive time, Code 35 pit rule, pit speed."
    blocks: [wrl.pit.min_stop_time, wrl.fcy.code35]
    who: owner
    where_to_get_it: "Event pages on racewrl.com (e.g. racewrl.com/sebring26) link Google Drive PDFs."
  - id: Q-WRL-3
    question: "The brief says WRL commonly has a minimum pit stop time and a driver maximum drive time. The 2022 rulebook has a 4 h stint maximum and 1 h break but no minimum pit time; the 2023 Road Atlanta notes say 'There is no minimum time on pit road.' Which applies in 2026?"
    blocks: [wrl.pit.min_stop_time, wrl.drive.max_stint]
    who: owner
  - id: Q-WRL-4
    question: "Which rulebook season covers the December 2025 COTA races (wrl-2025 vs wrl-2026)?"
    blocks: []
    who: owner
  - id: Q-WRL-5
    question: "Can WRL supply the Redmist flags / control-log CSVs (penalties, Code 35 times) going forward?"
    blocks: [wrl.fcy.code35, wrl.penalty.lap_deduction]
    who: owner
