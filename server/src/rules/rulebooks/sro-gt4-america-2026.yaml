  - id: Q-GT4-1
    question: "Supply the 2026 SRO America Sporting Regulations (and GT4 appendix): pit window, mandatory stop count, driver change, minimum drive time, FCY pit closure, classification, short-stop penalty formula."
    blocks: [gt4.pit.window, gt4.pit.mandatory_stop_count, gt4.driver.change_at_mandatory_stop, gt4.fcy.pits_closed, gt4.classification.min_distance]
    who: owner
    where_to_get_it: "https://teams.sroamerica.com/teams-login, or SRO America series office."
  - id: Q-GT4-2
    question: "Supply the Indianapolis 2026 stewards' bulletin (minimum pit stop time, drive-through equivalent)."
    blocks: [gt4.pit.min_stop_time, gt4.penalty.drive_through_equivalent]
    who: owner
    where_to_get_it: "https://www.gt4-america.com/noticeboard?meeting_id=103 in a browser (JavaScript list), category 'Stewards Bulletin'."
  - id: Q-GT4-3
    question: "Several normal stops run 10-16 s above the 108 s floor with no RC time penalty (R1 #5 122.718, #37 122.554, #007 123.910, #028 120.533; R2 #71 118.377, #21 118.030, #5 120.100, #92 118.364). Does GT4 America apply success/compensation pit time, or are these slow stops?"
    blocks: [gt4.pit.min_stop_time]
    who: owner
  - id: Q-GT4-4
    question: "Is there a pit-lane speed limit and per-driver drive-time requirement in GT4 America 2026? (Not encoded: no source.)"
    blocks: []
    who: owner
