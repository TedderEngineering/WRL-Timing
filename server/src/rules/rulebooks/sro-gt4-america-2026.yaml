defaults:
  tolerances:
    pit_clock_s: 0.5     # pit-card PDF vs Drive Time PIT stints agree within 1.5 s (ACCURACY_ALKAMEL §1); card vs PIT_TIME to the ms

rules:
  - id: gt4.pit.mandatory_stop_count
    type: mandatory_stops
    title: Each car makes the mandatory mid-race pit stop
    params:
      count: TBD
      counts_if: {kinds: [stop], in_window: TBD, with_driver_change: TBD}
    source: {doc: GT4A-EXPLAINER-2026, section: "Race format", page: 1}
    quote: "mandatory mid-race pit stops and driver changes"
    verified: false
    checkable_with:
      alkamel_sro: ["pit_cards_pdf.in_time", "pit_cards_pdf.pit_time", "drive_time_csv.STINT_TYPE=PIT", "results_csv.STATUS", "results_csv.LAPS"]
    check: |
      REQUIRE P.count != TBD else not_evaluated("mandatory stop count: SRO-SR-2026 not obtained")
      for car in results where status == Classified:
        n = count pit_events[car] where kind == stop and (not P.counts_if.in_window or in pit_window)
        if n < P.count:
          sev = possible if results[car].laps ≥ laps of the last car that stopped inside the window else info  # retired early
          EMIT(car, measured=n, threshold=P.count, evidence=[results id, pit_event ids], severity=sev)
    severity: possible
    penalty: {kind: TBD}
    tbd:
      - {field: params.count, question: "Number of mandatory stops per 60-minute race (SRO-SR-2026). Indianapolis data: every running car made exactly one normal stop; R2 #71 made two."}
      - {field: params.counts_if.in_window, question: "Must the mandatory stop be inside the pit window?"}
      - {field: params.counts_if.with_driver_change, question: "Does the mandatory stop require the driver change?"}

  - id: gt4.pit.window
    type: pit_window
    title: The mandatory stop is made inside the pit window
    params:
      open: {by: time, value: TBD, from: TBD}
      close: {by: time, value: TBD, from: TBD}
      applies_to_stop: mandatory
      boundary: TBD
      fcy_effect: TBD
    source: {doc: SRO-SR-2026, section: TBD, page: TBD}
    quote: "TBD"
    verified: false
    checkable_with:
      alkamel_sro: ["pit_cards_pdf.in_time", "pit_cards_pdf.out_time", "flags.GF", "flags.FCY"]
    check: |
      REQUIRE P.open.value != TBD and P.close.value != TBD else not_evaluated("pit window not known")
      t0 = race.start_time if P.open.from == green_flag else race.official_start
      for e in pit_events where e.kind == stop and e is the car's mandatory stop:
        t = e.in_time if P.boundary == pit_in else e.out_time
        if not (t0 + P.open.value ≤ t ≤ t0 + P.close.value):
          EMIT(e.car, measured=t - t0, threshold=[P.open.value, P.close.value], evidence=[e.id], severity=possible)
    severity: possible
    tbd:
      - {field: quote, question: "Fetch SRO-SR-2026 and quote the pit-window article."}
      - {field: source.section, question: "Article number of the pit window in SRO-SR-2026."}
      - {field: source.page, question: "Page of that article."}
      - {field: params.open.value, question: "Window opening (s after start). Indianapolis data only: first normal pit-in 1421.1 s (R1) / 1463.4 s (R2) after the green flag."}
      - {field: params.open.from, question: "Is the window measured from the green flag, the start signal, or the scheduled start?"}
      - {field: params.close.value, question: "Window closing. Indianapolis data: last mandatory pit-in 2073.7 s (R1) / 2097.2 s (R2) after the green flag (R2 #71's second stop at 2359.5 s excluded)."}
      - {field: params.close.from, question: "As for open.from."}
      - {field: params.boundary, question: "Must pit-in or pit-out fall inside the window?"}
      - {field: params.fcy_effect, question: "Does an FCY open/extend/freeze the window?"}

  - id: gt4.pit.min_stop_time
    type: min_pit_time
    title: Mandatory stop not shorter than the event's minimum pit stop time, loop to loop
    params:
      value_s: TBD
      measure: pit_lane_loop_to_loop
      applies_to_stop: mandatory
      add_pending_time_penalties: true
      variants: TBD
    source:
      - {doc: SRO-BUL-RA-2026-03A, section: "Minimum Pit Stop Time", page: 1}
      - {doc: SRO-SR-2026, section: TBD, page: TBD, field: value_s}
    quote: "measured loop to loop (pit-in timing line to pit-out timing line)"
    verified: false
    checkable_with:
      alkamel_sro: ["pit_cards_pdf.pit_time", "drive_time_csv.TIME(STINT_TYPE=PIT)", "analysis_csv.PIT_TIME", "flags.RCMessage(\"Short Pit Stop Time\"|\"Time Penalty at next eligible stop\")"]
    check: |
      REQUIRE P.value_s != TBD else not_evaluated("event minimum pit stop time not supplied (stewards' bulletin)")
      for e in pit_events where e.kind == stop and e is the car's mandatory stop:
        REQUIRE e.pit_lane_time_source in {pit_card, drive_time} else not_evaluated("no official pit-lane time")
        pending = Σ p.value_s for p in penalties[e.car] where p.kind == time_at_next_stop and p.announced < e.in_time and not yet applied
        req = (variant value if a variant applies, e.g. single-driver entry) or P.value_s
        req = req + pending
        if e.pit_lane_time_s < req - tol(pit_clock_s):
          EMIT(e.car, measured=e.pit_lane_time_s, threshold=req, margin_s=e.pit_lane_time_s - req,
               evidence=[e.id] + pending penalty ids, severity=possible,
               note="RC short-stop penalty present" if an RC 'Short Pit Stop Time' message names e.car else "no RC penalty found")
    severity: possible
    penalty: {kind: TBD, text: "Observed: time penalty of 10 x the shortfall (GT4 Decision No. 3, Road Atlanta) or a drive-through (Indianapolis R1 #11). The governing article was not obtained."}
    timing_signature: "Pit card PIT_TIME below the minimum; RC 'Penalty - Short Pit Stop Time - …' follows within minutes."
    tbd:
      - {field: params.value_s, question: "Per event, from the stewards' bulletin. Sonoma 90 s and Road Atlanta 83 s are in the event overrides; Indianapolis is TBD."}
      - {field: params.variants, question: "Do single-driver entries or other cases have a different minimum (McLaren Trophy has one for single-driver cars)?"}
      - {field: source.section, question: "Article of SRO-SR-2026 that creates the minimum pit stop time."}
      - {field: source.page, question: "Page of that article."}

  - id: gt4.penalty.time_at_next_stop
    type: penalty_service
    title: Time penalties announced for 'the next eligible stop' are added to that stop
    params: {serve_at: next_eligible_stop, unserved: post_race_time}
    source: {doc: GT4-RC-INDY-R1, section: "RC message, file line 10", page: 1}
    quote: "Car 92: Penalty - Incident Responsibility - 10 sec Time Penalty at next eligible stop"
    verified: false
    checkable_with:
      alkamel_sro: ["flags.RCMessage", "pit_cards_pdf.pit_time"]
    check: |
      Feeds gt4.pit.min_stop_time (pending penalties). Additionally:
      for p in penalties where kind == time_at_next_stop and no stop of p.car after p.announced:
        EMIT(p.car, measured="no eligible stop after the penalty", evidence=[p.id], severity=info,
             note="expected to appear as post-race time in official results")
    severity: info
    notes: "Indianapolis: R1 #92 and #24 (+10 s) and R2 #33 (+10 s total) stops all at or above 108.0 + 10 s; R2 #5's 10 s came after its only stop."

  - id: gt4.penalty.drive_through_equivalent
    type: penalty_service
    title: Drive-through penalty equivalent (time added when a drive-through is converted)
    params: {unserved_drive_through_equivalent_s: TBD}
    source: {doc: SRO-BUL-RA-2026-03A, section: "Drive Thru Penalty Equivalent", page: 1}
    quote: "The Drive Thru Penalty Equivalent Time for the GTWC, GT4, GTA, and GR Cup is: 43 seconds"
    verified: false
    checkable_with:
      alkamel_sro: ["flags.RCMessage(\"Drive Through\"|\"Penalty Served\")", "pit_cards_pdf.pit_time", "drive_time_csv.PIT_TYPE=PENALTY"]
    check: |
      for p in penalties where p.kind == drive_through:
        e = first unused pit_event of p.car after p.announced with kind == drive_through
        if not e: EMIT(p.car, measured="no drive-through passage", evidence=[p.id], severity=possible,
                       note="may have been converted to P.unserved_drive_through_equivalent_s post-race")
    severity: possible
    timing_signature: "Indianapolis drive-throughs are 61.9-63.9 s pit-lane passages, Drive Time PIT_TYPE=PENALTY, RC 'Penalty Served'."
    tbd:
      - {field: params.unserved_drive_through_equivalent_s, question: "Per event (bulletin). Sonoma 50 s, Road Atlanta 43 s; Indianapolis TBD."}

  - id: gt4.driver.change_at_mandatory_stop
    type: driver_change
    title: Two drivers share the car; the driver change is made at the mandatory stop
    params:
      every_nominated_driver_must_drive: TBD
      required_at: mandatory_stop
      single_driver_allowed: TBD
    source: {doc: GT4A-EXPLAINER-2026, section: "Teams and drivers", page: 1}
    quote: "Teams are composed of two drivers who share driving duties"
    verified: false
    checkable_with:
      alkamel_sro: ["drive_time_csv.DRIVER", "drive_time_csv.START", "drive_time_csv.END", "analysis_csv.DRIVER_NUMBER", "results_csv.DRIVER1_*", "results_csv.DRIVER2_*"]
    check: |
      REQUIRE P.single_driver_allowed != TBD else (run, but cap severity at possible and add note "single-driver permission unknown")
      for car where exactly one normal stop e:
        before = driver of the last TRACK stint ending at/before e.in_time; after = driver of the first TRACK stint starting at/after e.out_time
        if before == after:
          EMIT(car, measured="same driver {before}", evidence=[e.id, stint ids], severity=possible,
               note="a single-driver entry may be permitted with a different minimum stop time")
    severity: possible
    tbd:
      - {field: params.every_nominated_driver_must_drive, question: "SRO-SR-2026 driver participation article."}
      - {field: params.single_driver_allowed, question: "Can a nominated pair race with one driver (Indianapolis R2 #37: L. Hayes drove 60:00, stop 114.835 s)?"}

  - id: gt4.fcy.pits_closed
    type: fcy_pit_procedure
    title: Pits closed under FCY until Race Control announces them open
    params: {pits_closed_on: TBD, opens_on: "RC 'PITS ARE OPEN'"}
    source:
      - {doc: GT4-RC-INDY-R2, section: "RC message, file line 6", page: 1}
      - {doc: SRO-SR-2026, section: TBD, page: TBD, field: pits_closed_on}
    quote: "PITS ARE CLOSED"
    verified: false
    checkable_with:
      alkamel_sro: ["flags.REC_TYPE=FCY", "flags.RCMessage(\"PITS ARE CLOSED\"|\"PITS ARE OPEN\")", "pit_cards_pdf.in_time"]
    check: |
      REQUIRE fcy_periods from flags_file else not_evaluated("no flags file (e.g. SRO COTA)")
      closed from max(FCY start, RC 'PITS ARE CLOSED') (P.pits_closed_on decides which) to RC 'PITS ARE OPEN'
      for e in pit_events with e.in_time inside a closed interval:
        sev = info if e.kind in {retirement, garage} else possible
        EMIT(e.car, measured=e.in_time, threshold=open time, evidence=[e.id, rc ids], severity=sev)
    severity: possible
    tbd:
      - {field: params.pits_closed_on, question: "Are pits closed at the FCY call (R1 had no 'PITS ARE CLOSED' message) or only at the RC message?"}
      - {field: source.section, question: "FCY / pit closure article in SRO-SR-2026."}
      - {field: source.page, question: "Page of that article."}

  - id: gt4.classification.min_distance
    type: classification
    title: Classification requirement (minimum distance) and results status
    params: {min_fraction: TBD, results_source: official_results_file}
    source: {doc: SRO-SR-2026, section: TBD, page: TBD}
    quote: "TBD"
    verified: false
    checkable_with:
      alkamel_sro: ["results_csv.STATUS", "results_csv.LAPS"]
    check: |
      Results status is taken from the results file. If P.min_fraction known:
        for car where results.status == Classified and laps < P.min_fraction × winner laps:
          EMIT(car, severity=info, note="listed Classified below the minimum distance (results are provisional?)")
    severity: info
    notes: "Indianapolis provisional results list every starter as 'Classified', including R2 #19 with 0 laps."
    tbd:
      - {field: quote, question: "Fetch SRO-SR-2026 and quote the classification article."}
      - {field: params.min_fraction, question: "Minimum distance to be classified."}
      - {field: source.section, question: "Article number."}
      - {field: source.page, question: "Page."}

